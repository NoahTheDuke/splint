name: CI

on: [push]

jobs:
  lint:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest]
        java: [17, 21, 25]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}

      - name: Setup clojure-lsp
        uses: clojure-lsp/setup-clojure-lsp@v1
        with:
          clojure-lsp-version: 2026.02.20-16.08.58

      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.6.1673
          bb: 1.13.219

      - name: Cache clojure dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: cljdeps-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: cljdeps-

      - name: clojure-lsp
        run: clojure-lsp diagnostics

      - name: splint self
        run: bb run splint

      - name: bb lazytest
        run: bb run lazytest --doctests --md README.md --dir test --output short

      - name: "1.11 Tests"
        run: clojure -M:v1.11:dev:test:runner --doctests --md README.md --dir test --output short

      - name: "1.12 Tests"
        run: clojure -M:v1.12:dev:test:runner --doctests --md README.md --dir test --output short

      - name: "1.13 Tests"
        run: clojure -M:v1.13:dev:test:runner --doctests --md README.md --dir test --output short
